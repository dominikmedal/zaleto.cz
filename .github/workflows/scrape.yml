name: scrape

# Každá cestovní kancelář má vlastní běh (a vlastní čas), aby se vešla do limitu 6 hodin na job.
# Plný scrape Fischeru a Eximu se rozloží do více dní: checkpointy drží společný klíč cyklu (ISO týden),
# po vypršení časového limitu se další denní běh navazuje tam, kde předchozí skončil.
on:
  schedule:
    - cron: '0 1 * * 1'   # pondělí 01:00 UTC – Čedok
    - cron: '0 1 * * 2'   # úterý   01:00 UTC – Blue Style
    - cron: '0 1 * * 3'   # středa  01:00 UTC – TUI
    - cron: '0 2 * * *'   # denně   02:00 UTC – Fischer (update-only, jednou za 14 dní plný scrape po částech)
    - cron: '0 3 * * *'   # denně   03:00 UTC – Exim Tours (totéž)
  workflow_dispatch:
    inputs:
      only:
        description: 'Jen tyto agentury, oddělené čárkou (Fischer, Exim, Blue Style, Cedok, TUI); prázdné = všechny (nevejde se do 6 h)'
        type: string
        default: ''
      skip_email:
        description: 'Neodesílat e-mailový report'
        type: boolean
        default: true

# stejná agentura se nikdy nespouští dvakrát souběžně
concurrency:
  group: scrape-${{ github.event.schedule || inputs.only || 'all' }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # limit GitHub Actions je 360 min na job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt

      - name: Vyber agenturu a cyklus
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          ONLY_INPUT: ${{ inputs.only }}
        run: |
          case "$SCHEDULE" in
            "0 1 * * 1") ONLY="Cedok" ;;
            "0 1 * * 2") ONLY="Blue Style" ;;
            "0 1 * * 3") ONLY="TUI" ;;
            "0 2 * * *") ONLY="Fischer" ;;
            "0 3 * * *") ONLY="Exim" ;;
            *) ONLY="$ONLY_INPUT" ;;
          esac
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"
          echo "cycle=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "Agentura: ${ONLY:-všechny}"

      - name: Scrape
        working-directory: scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          SCRAPER_DELAY: '1.5'
          SCRAPER_WORKERS: '3'
          SCRAPER_CYCLE: ${{ steps.pick.outputs.cycle }}
          ONLY: ${{ steps.pick.outputs.only }}
          SKIP_EMAIL: ${{ github.event_name == 'schedule' || inputs.skip_email }}
        run: |
          args=(--once)
          [ "$SKIP_EMAIL" = "true" ] && args+=(--skip-email)
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          code=0
          timeout -k 60 335m python run_all.py "${args[@]}" || code=$?
          if [ "$code" = "124" ]; then
            echo "::notice::Časový limit běhu vypršel, rozpracovaný scrape naváže další plánovaný běh (checkpointy jsou uložené)."
            exit 0
          fi
          exit "$code"

      # i po vypršení limitu je potřeba přepočítat ceny hotelů a obnovit cache webu
      - name: Úklid, přepočet hotel_stats a obnova cache
        if: always()
        working-directory: scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: python run_all.py --purge-only
