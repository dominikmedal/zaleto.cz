name: scrape

on:
  schedule:
    - cron: '0 2 1 * *'   # plný scrape 1. dne v měsíci, 02:00 UTC
  workflow_dispatch:
    inputs:
      skip_email:
        description: 'Neodesílat e-mailový report'
        type: boolean
        default: false
      only:
        description: 'Jen tyto agentury, oddělené čárkou (Fischer, Exim, Blue Style, Cedok, TUI); prázdné = všechny'
        type: string
        default: ''

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # limit GitHub Actions je 360 min na job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Scrape + párování + hotel_stats
        working-directory: scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          SCRAPER_DELAY: '1.5'
        run: python run_all.py --once ${{ inputs.skip_email && '--skip-email' || '' }} ${{ inputs.only && format('--only "{0}"', inputs.only) || '' }}
